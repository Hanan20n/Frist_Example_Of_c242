<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="308" viewBox="0 0 1400 308"><rect width="100%" height="100%" fill="#171923"/><g fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="20"><text x="34" y="56" xml:space="preserve">int totalStudents;</text><text x="34" y="86" xml:space="preserve"></text><text x="34" y="116" xml:space="preserve">if (!int.TryParse(txtStudentCount.Text, out totalStudents) ||</text><text x="34" y="146" xml:space="preserve">    totalStudents &lt;= 0)</text><text x="34" y="176" xml:space="preserve">{</text><text x="34" y="206" xml:space="preserve">    MessageBox.Show(&quot;Enter a valid positive number.&quot;);</text><text x="34" y="236" xml:space="preserve">    return;</text><text x="34" y="266" xml:space="preserve">}</text></g></svg>