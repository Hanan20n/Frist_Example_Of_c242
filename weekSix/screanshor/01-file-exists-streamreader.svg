<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="488" viewBox="0 0 1400 488"><rect width="100%" height="100%" fill="#171923"/><g fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="20"><text x="34" y="56" xml:space="preserve">if (!File.Exists(filePath))</text><text x="34" y="86" xml:space="preserve">{</text><text x="34" y="116" xml:space="preserve">    MessageBox.Show(&quot;The students file was not found.&quot;);</text><text x="34" y="146" xml:space="preserve">    return;</text><text x="34" y="176" xml:space="preserve">}</text><text x="34" y="206" xml:space="preserve"></text><text x="34" y="236" xml:space="preserve">using (StreamReader inputFile = File.OpenText(filePath))</text><text x="34" y="266" xml:space="preserve">{</text><text x="34" y="296" xml:space="preserve">    while (!inputFile.EndOfStream)</text><text x="34" y="326" xml:space="preserve">    {</text><text x="34" y="356" xml:space="preserve">        string line = inputFile.ReadLine();</text><text x="34" y="386" xml:space="preserve">        lstNames.Items.Add(line);</text><text x="34" y="416" xml:space="preserve">    }</text><text x="34" y="446" xml:space="preserve">}</text></g></svg>