<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="428" viewBox="0 0 1400 428"><rect width="100%" height="100%" fill="#171923"/><g fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="20"><text x="34" y="56" xml:space="preserve">switch (month)</text><text x="34" y="86" xml:space="preserve">{</text><text x="34" y="116" xml:space="preserve">    case 1:</text><text x="34" y="146" xml:space="preserve">        MessageBox.Show(&quot;January&quot;);</text><text x="34" y="176" xml:space="preserve">        break;</text><text x="34" y="206" xml:space="preserve">    case 2:</text><text x="34" y="236" xml:space="preserve">        MessageBox.Show(&quot;February&quot;);</text><text x="34" y="266" xml:space="preserve">        break;</text><text x="34" y="296" xml:space="preserve">    default:</text><text x="34" y="326" xml:space="preserve">        MessageBox.Show(&quot;Invalid month&quot;);</text><text x="34" y="356" xml:space="preserve">        break;</text><text x="34" y="386" xml:space="preserve">}</text></g></svg>